<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aaron Running Loader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="demo-card" aria-labelledby="demo-title">
        <p class="eyebrow">CSS SPRITE LOADER</p>
        <h1 id="demo-title">Building something awesome…</h1>

        <div class="loader-stage" role="status" aria-label="Loading">
          <span class="runner-shadow" aria-hidden="true"></span>
          <span class="runner-viewport" aria-hidden="true">
            <img
              class="runner-strip"
              src="aaron-run-sprite.png"
              alt=""
              width="3970"
              height="397"
            />
          </span>
        </div>

        <div class="progress-track" aria-hidden="true">
          <span class="progress-glow"></span>
        </div>
      </section>
    </main>
  </body>
</html>
